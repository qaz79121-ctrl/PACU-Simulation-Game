<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACU Medication Mission</title><link rel="stylesheet" href="css/game.css"></head>
<body>
<header class="hud">
 <div class="brand"><span class="clip">📋</span><div><b>PACU</b><small>Medication Mission</small></div></div>
 <div class="stat">⭐ <b id="score">0</b><span>/100<br><small>總分</small></span></div>
 <div class="stat">👥 <b id="patients">0</b><span>/3<br><small>完成病人數</small></span></div>
 <div class="progress"><div class="bar"><i id="bar"></i></div><b id="step">PACU-1｜步驟 1/12</b></div>
 <div class="clock">⏱️ <b id="timer">00:00</b></div>
 <button id="help">📖 遊戲說明</button><button id="reset">↻ 重新開始</button>
</header>
<main>
 <section id="scene" class="scene" aria-label="PACU 主場景">
   <img src="assets/ui/pacu_scene.png" alt="PACU 三床恢復室場景">
   <div id="hotspots">
    <button class="hotspot sink" data-zone="sink">🫧 洗手台</button>
    <button class="hotspot cart" data-zone="cart">💊 電腦藥物車</button>
    <button class="hotspot doctor" data-zone="doctor">👨‍⚕️ 醫師 ISBAR</button>
    <button class="hotspot bed b1" data-zone="bed">PACU-1</button><button class="hotspot bed b2" data-zone="bed">PACU-2</button><button class="hotspot bed b3" data-zone="bed">PACU-3</button>
    <button class="hotspot iv" data-zone="iv">💉 點滴架側</button><button class="hotspot monitor" data-zone="monitor">📈 監視器側</button>
   </div>
   <div id="nurse" class="nurse">👩🏻‍⚕️</div>
   <div class="mission"><b id="missionTitle">目前任務：評估病人</b><span id="missionHint">請走到目前病人床側</span></div>
 </section>
 <nav id="taskbar" class="taskbar" aria-label="12步驟流程"></nav>
</main>
<div id="toast" class="toast" role="status"></div>
<div id="modal" class="modal" aria-hidden="true"><div class="panel"><button class="x" id="close">×</button><div id="modalBody"></div></div></div>
<script type="module" src="js/app.js"></script></body></html>
